        async sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !this.currentChatId) return;
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (!chat) return;
            chat.messages.push({ role: 'user', content: content });
            input.value = '';
            this.autoResizeInput();
            this.saveToStorage();
            this.renderMessages({ forceScroll: true });
            const apiKey = this.getApiKey();
            if (apiKey && this.selectedModel) {
                this.isResponding = true;
                this.updateSendButton();
                await this.sendToOpenRouter(chat, apiKey, this.selectedModel, content);
            } else {
                chat.messages.push({
                    role: 'assistant',
                    content: `[No ${!apiKey ? 'API key' : 'model'} selected.]\n\nYou said: ${content}`
                });
                this.saveToStorage();
                this.renderMessages();
            }
        }

        _extractSSEData(eventText) {
            const lines = eventText.split('\n');
            const dataLines = [];
            for (const line of lines) {
                const trimmed = line.trimStart();
                if (trimmed.startsWith('data:')) dataLines.push(trimmed.slice(5).trimStart());
            }
            if (dataLines.length === 0) return null;
            return dataLines.join('\n');
        }

        _scheduleStreamRender() {
            if (this._streamRenderScheduled) return;
            this._streamRenderScheduled = true;
            this._streamRenderTimer = setTimeout(() => {
                this._streamRenderScheduled = false;
                this._streamRenderTimer = null;
                if (this.currentView === 'chat') this._updateStreamingMessageDOM();
            }, 60);
        }

        _updateStreamingMessageDOM() {
            const streamingEl = document.querySelector('.message.streaming');
            if (!streamingEl) { this.renderMessages(); return; }
            const messagesContainer = document.getElementById('messages');
            const wasNearBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 80;
            const index = parseInt(streamingEl.dataset.messageIndex, 10);
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (!chat) return;
            const message = chat.messages[index];
            if (!message) return;
            const contentEl = streamingEl.querySelector('.message-content');
            if (!contentEl) return;
            const displayContent = message._streamPreview !== undefined ? message._streamPreview : message.content;
            contentEl.innerHTML = displayContent;
            contentEl.style.whiteSpace = 'pre-wrap';
            contentEl.style.wordBreak = 'break-word';
            if (message.streaming) {
                const cursor = document.createElement('span');
                cursor.className = 'streaming-cursor';
                contentEl.appendChild(cursor);
            }
            if (wasNearBottom) messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        _commitStreamResult(chat, targetMessage, retryContext, accumulated, aborted) {
            if (retryContext) {
                const { oldContent, existingChainIndex } = retryContext;
                if (!chat.retryChains) chat.retryChains = [];
                let chainIndex = existingChainIndex;
                let chain;
                if (chainIndex === null || !chat.retryChains[chainIndex]) {
                    chainIndex = chat.retryChains.length;
                    chain = { versions: [oldContent], currentVersion: 0, index: chainIndex, partialFlags: [false] };
                    chat.retryChains.push(chain);
                } else {
                    chain = chat.retryChains[chainIndex];
                    if (!chain.partialFlags) chain.partialFlags = new Array(chain.versions.length).fill(false);
                }
                chain.versions.push(accumulated);
                chain.partialFlags.push(!!aborted);
                chain.currentVersion = chain.versions.length - 1;
                targetMessage.content = accumulated;
                targetMessage.chainId = chainIndex;
                delete targetMessage._streamPreview;
                delete targetMessage.streaming;
                if (aborted) targetMessage.partial = true;
                else delete targetMessage.partial;
            } else {
                targetMessage.content = accumulated;
                delete targetMessage._streamPreview;
                delete targetMessage.streaming;
                if (aborted) targetMessage.partial = true;
            }
        }

        async sendToOpenRouter(chat, apiKey, model, userMessage, retryContext = null) {
            this.abortController = new AbortController();
            const lorebookContext = this.buildLorebookContext(userMessage);
            const systemPrompt = `You are a helpful AI assistant engaged in roleplay.${lorebookContext}`;
            const historyMessages = retryContext ? chat.messages.slice(0, retryContext.messageIndex) : chat.messages;
            const requestBody = {
                model: model,
                messages: [
                    { role: 'system', content: systemPrompt },
                    ...historyMessages.map(m => ({ role: m.role, content: m.content }))
                ],
                temperature: this.llmSettings.temperature,
                top_p: this.llmSettings.top_p,
                top_k: this.llmSettings.top_k,
                frequency_penalty: this.llmSettings.frequency_penalty,
                presence_penalty: this.llmSettings.presence_penalty,
                repetition_penalty: this.llmSettings.repetition_penalty,
                min_p: this.llmSettings.min_p,
                top_a: this.llmSettings.top_a,
                max_tokens: this.llmSettings.max_tokens,
                stream: true,
                stream_options: { include_usage: true }
            };
            
            let targetMessage;
            if (retryContext) {
                targetMessage = chat.messages[retryContext.messageIndex];
                if (!targetMessage) {
                    this.isResponding = false;
                    this.abortController = null;
                    this.updateSendButton();
                    return;
                }
                targetMessage.streaming = true;
                targetMessage._streamPreview = '';
            } else {
                targetMessage = { role: 'assistant', content: '', streaming: true, _streamPreview: '' };
                chat.messages.push(targetMessage);
            }
            
            this.renderMessages({ forceScroll: true });
            let accumulated = '';
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Roleplay Chat'
                    },
                    body: JSON.stringify(requestBody),
                    signal: this.abortController.signal
                });
                
                if (!response.ok) {
                    let errorMessage = `HTTP ${response.status}`;
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.error?.message || errorMessage;
                    } catch {
                        const text = await response.text();
                        if (text) errorMessage = text.substring(0, 500);
                    }
                    throw new Error(errorMessage);
                }
                
                if (!response.body) throw new Error('Response has no body');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let streamDone = false;
                
                while (!streamDone) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    buffer = buffer.replace(/\r\n/g, '\n');
                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        const eventText = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        const data = this._extractSSEData(eventText);
                        if (data === null) continue;
                        if (data === '[DONE]') { streamDone = true; break; }
                        let parsed;
                        try { parsed = JSON.parse(data); } catch { continue; }
                        if (parsed.error) throw new Error(parsed.error.message || 'Stream error');
                        const choice = parsed.choices && parsed.choices[0];
                        if (!choice) continue;
                        const delta = choice.delta && choice.delta.content;
                        if (delta) {
                            accumulated += delta;
                            targetMessage._streamPreview = accumulated;
                            this._scheduleStreamRender();
                        }
                    }
                }
                
                this._commitStreamResult(chat, targetMessage, retryContext, accumulated, false);
                this.saveToStorage();
                this.renderMessages();
            } catch (error) {
                if (error.name === 'AbortError') {
                    if (accumulated) {
                        this._commitStreamResult(chat, targetMessage, retryContext, accumulated, true);
                    } else {
                        if (retryContext) {
                            delete targetMessage._streamPreview;
                            delete targetMessage.streaming;
                        } else {
                            const idx = chat.messages.indexOf(targetMessage);
                            if (idx !== -1) chat.messages.splice(idx, 1);
                        }
                    }
                    this.saveToStorage();
                    this.renderMessages();
                    return;
                }
                if (accumulated) {
                    this._commitStreamResult(chat, targetMessage, retryContext, accumulated, true);
                } else if (retryContext) {
                    delete targetMessage._streamPreview;
                    delete targetMessage.streaming;
                } else {
                    targetMessage.content = `[Error: ${error.message}]`;
                    delete targetMessage._streamPreview;
                    delete targetMessage.streaming;
                }
                this.saveToStorage();
                this.renderMessages();
            } finally {
                this.isResponding = false;
                this.abortController = null;
                this.updateSendButton();
            }
        }

        renderModelOptions(filter = '') {
            const modelOptions = document.getElementById('modelOptions');
            modelOptions.innerHTML = '';
            if (this.availableModels.length === 0) {
                modelOptions.innerHTML = '<div class="model-option">No models loaded.</div>';
                return;
            }
            const filtered = this.availableModels.filter(model => {
                if (!filter) return true;
                const term = filter.toLowerCase();
                return model.id.toLowerCase().includes(term) || (model.name && model.name.toLowerCase().includes(term));
            }).sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
            
            filtered.forEach(model => {
                const option = document.createElement('div');
                option.className = 'model-option';
                if (model.id === this.selectedModel) option.classList.add('selected');
                option.textContent = model.name || model.id;
                option.addEventListener('click', () => {
                    this.selectedModel = model.id;
                    document.getElementById('modelSelect').textContent = model.name || model.id;
                    this.closeModelDropdown();
                    this.saveSettings();
                });
                modelOptions.appendChild(option);
            });
        }

        closeModelDropdown() {
            document.getElementById('modelDropdown').classList.remove('active');
        }

        _positionModelDropdown() {
            const wrapper = document.getElementById('modelSelectWrapper');
            const dropdown = document.getElementById('modelDropdown');
            const sidebar = document.getElementById('sidebar');
            if (!wrapper || !dropdown || !sidebar) return;
            if (!dropdown.classList.contains('active')) return;
            dropdown.style.maxHeight = '';
            const triggerRect = wrapper.getBoundingClientRect();
            const viewportHeight = window.innerHeight;
            const margin = 12;
            const minHeight = 150;
            const preferredHeight = 300;
            const maxScrollRemaining = Math.max(0, sidebar.scrollHeight - sidebar.clientHeight - sidebar.scrollTop);
            const lowestTriggerBottom = triggerRect.bottom - maxScrollRemaining;
            const maxPossible = viewportHeight - lowestTriggerBottom - margin;
            let targetHeight;
            if (maxPossible >= preferredHeight) targetHeight = preferredHeight;
            else targetHeight = Math.max(minHeight, maxPossible);
            dropdown.style.maxHeight = targetHeight + 'px';
            const actualHeight = dropdown.offsetHeight || targetHeight;
            const scrollNeeded = triggerRect.bottom + actualHeight + margin - viewportHeight;
            if (scrollNeeded > 0) {
                const targetScroll = Math.min(sidebar.scrollTop + scrollNeeded, sidebar.scrollHeight - sidebar.clientHeight);
                sidebar.scrollTop = targetScroll;
            }
        }

        renderMessages(options = {}) {
            const messagesContainer = document.getElementById('messages');
            const forceScroll = options.forceScroll === true;
            const prevScrollTop = messagesContainer.scrollTop;
            const wasNearBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 80;
            messagesContainer.innerHTML = '';
            if (!this.currentChatId) return;
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (!chat) return;
            
            chat.messages.forEach((message, index) => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${message.role}`;
                messageElement.dataset.messageIndex = index;
                if (message.streaming) messageElement.classList.add('streaming');
                
                const roleLabel = document.createElement('div');
                roleLabel.className = 'message-role';
                roleLabel.textContent = message.role === 'user' ? 'You' : 'Assistant';
                
                let displayContent = message.content;
                let displayVersion = -1;
                let displayTotal = 1;
                let isPartialVersion = false;
                
                if (message.role === 'assistant' && message.chainId !== undefined && message.chainId !== null) {
                    const chain = chat.retryChains ? chat.retryChains[message.chainId] : null;
                    if (chain && chain.versions.length > 0) {
                        displayVersion = chain.currentVersion;
                        displayTotal = chain.versions.length;
                        displayContent = chain.versions[displayVersion];
                        if (chain.partialFlags && chain.partialFlags[displayVersion]) isPartialVersion = true;
                    }
                }
                if (message.streaming && message._streamPreview !== undefined) displayContent = message._streamPreview;
                if (!message.streaming && (isPartialVersion || message.partial)) {
                    const badge = document.createElement('span');
                    badge.className = 'partial-badge';
                    badge.textContent = 'stopped';
                    roleLabel.appendChild(badge);
                }
                
                const contentElement = document.createElement('div');
                contentElement.className = 'message-content';
                contentElement.innerHTML = displayContent;
                contentElement.style.whiteSpace = 'pre-wrap';
                contentElement.style.wordBreak = 'break-word';
                if (message.streaming) {
                    const cursor = document.createElement('span');
                    cursor.className = 'streaming-cursor';
                    contentElement.appendChild(cursor);
                }
                
                messageElement.appendChild(roleLabel);
                messageElement.appendChild(contentElement);
                
                const actions = document.createElement('div');
                actions.className = 'message-actions';
                
                if (message.role === 'assistant' && displayTotal > 1) {
                    const versionNav = document.createElement('div');
                    versionNav.className = 'version-nav';
                    const prevBtn = document.createElement('button');
                    prevBtn.className = 'version-btn';
                    prevBtn.textContent = '◀';
                    prevBtn.disabled = displayVersion <= 0;
                    prevBtn.addEventListener('click', () => this.prevVersion(message.chainId));
                    const versionLabel = document.createElement('span');
                    versionLabel.className = 'version-label';
                    versionLabel.textContent = `${displayVersion + 1}/${displayTotal}`;
                    const nextBtn = document.createElement('button');
                    nextBtn.className = 'version-btn';
                    nextBtn.textContent = '▶';
                    nextBtn.disabled = displayVersion >= displayTotal - 1;
                    nextBtn.addEventListener('click', () => this.nextVersion(message.chainId));
                    versionNav.appendChild(prevBtn);
                    versionNav.appendChild(versionLabel);
                    versionNav.appendChild(nextBtn);
                    actions.appendChild(versionNav);
                }
                
                const editBtn = document.createElement('button');
                editBtn.textContent = '✎';
                editBtn.title = 'Edit';
                editBtn.addEventListener('click', () => this.editMessage(index));
                actions.appendChild(editBtn);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '✕';
                deleteBtn.title = 'Delete';
                deleteBtn.addEventListener('click', () => this.deleteMessage(index));
                actions.appendChild(deleteBtn);
                
                const resendBtn = document.createElement('button');
                resendBtn.textContent = '↻';
                resendBtn.title = 'Resend';
                if (message.role === 'assistant') {
                    resendBtn.addEventListener('click', () => this.retryMessage(index));
                } else {
                    resendBtn.addEventListener('click', () => this.resendMessage(index));
                }
                actions.appendChild(resendBtn);
                
                messageElement.appendChild(actions);
                messagesContainer.appendChild(messageElement);
            });
            
            if (forceScroll || wasNearBottom) messagesContainer.scrollTop = messagesContainer.scrollHeight;
            else messagesContainer.scrollTop = prevScrollTop;
        }

        async retryMessage(index) {
            if (this.isResponding) return;
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (!chat) return;
            const message = chat.messages[index];
            if (!message || message.role !== 'assistant') return;
            if (message.streaming) return;
            let userMessageIndex = -1;
            for (let i = index - 1; i >= 0; i--) {
                if (chat.messages[i].role === 'user') { userMessageIndex = i; break; }
            }
            if (userMessageIndex === -1) return;
            const userMessage = chat.messages[userMessageIndex].content;
            const apiKey = this.getApiKey();
            if (!apiKey || !this.selectedModel) {
                alert('Please configure your API key and model first.');
                return;
            }
            const retryContext = {
                messageIndex: index,
                oldContent: message.content,
                existingChainIndex: (message.chainId !== undefined && message.chainId !== null) ? message.chainId : null
            };
            this.isResponding = true;
            this.updateSendButton();
            await this.sendToOpenRouter(chat, apiKey, this.selectedModel, userMessage, retryContext);
        }

        prevVersion(chainId) {
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (!chat || !chat.retryChains) return;
            const chain = chat.retryChains[chainId];
            if (!chain || chain.currentVersion <= 0) return;
            chain.currentVersion--;
            const message = chat.messages.find(m => m.chainId === chainId && m.role === 'assistant');
            if (message) {
                message.content = chain.versions[chain.currentVersion];
                if (chain.partialFlags && chain.partialFlags[chain.currentVersion]) message.partial = true;
                else delete message.partial;
            }
            this.renderMessages();
        }

        nextVersion(chainId) {
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (!chat || !chat.retryChains) return;
            const chain = chat.retryChains[chainId];
            if (!chain || chain.currentVersion >= chain.versions.length - 1) return;
            chain.currentVersion++;
            const message = chat.messages.find(m => m.chainId === chainId && m.role === 'assistant');
            if (message) {
                message.content = chain.versions[chain.currentVersion];
                if (chain.partialFlags && chain.partialFlags[chain.currentVersion]) message.partial = true;
                else delete message.partial;
            }
            this.renderMessages();
        }

        editMessage(index) {
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (!chat) return;
            const message = chat.messages[index];
            if (!message) return;
            if (message.streaming) return;
            const messagesContainer = document.getElementById('messages');
            const messageElement = messagesContainer.querySelector(`[data-message-index="${index}"]`);
            const contentElement = messageElement?.querySelector('.message-content');
            if (!contentElement) return;
            
            const form = document.createElement('div');
            form.className = 'message-edit-form';
            const textarea = document.createElement('textarea');
            textarea.className = 'message-edit-textarea';
            textarea.value = message.content;
            textarea.placeholder = 'Edit message...';
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'edit-actions';
            const saveBtn = document.createElement('button');
            saveBtn.className = 'save-btn';
            saveBtn.textContent = 'Save';
            saveBtn.addEventListener('click', () => {
                const newContent = textarea.value.trim();
                if (newContent) {
                    message.content = newContent;
                    if (message.chainId !== undefined && message.chainId !== null && chat.retryChains) {
                        const chain = chat.retryChains[message.chainId];
                        if (chain) {
                            chain.versions[chain.currentVersion] = newContent;
                            if (chain.partialFlags && chain.partialFlags[chain.currentVersion]) {
                                chain.partialFlags[chain.currentVersion] = false;
                                delete message.partial;
                            }
                        }
                    }
                    this.saveToStorage();
                    this.renderMessages();
                }
            });
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'cancel-btn';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', () => this.renderMessages());
            actionsDiv.appendChild(saveBtn);
            actionsDiv.appendChild(cancelBtn);
            form.appendChild(textarea);
            form.appendChild(actionsDiv);
            contentElement.innerHTML = '';
            contentElement.appendChild(form);
            
            textarea.style.height = 'auto';
            const maxHeight = window.innerHeight * 0.6;
            textarea.style.height = Math.min(textarea.scrollHeight, maxHeight) + 'px';
            
            requestAnimationFrame(() => {
                if (!document.body.contains(form)) return;
                const formRect = form.getBoundingClientRect();
                const containerRect = messagesContainer.getBoundingClientRect();
                const currentTopInViewport = formRect.top - containerRect.top;
                const desiredTop = 70;
                
                if (currentTopInViewport < desiredTop) {
                    const formTopInScrollSpace = formRect.top - containerRect.top + messagesContainer.scrollTop;
                    const targetScroll = Math.max(0, formTopInScrollSpace - desiredTop);
                    messagesContainer.scrollTop = targetScroll;
                }
            });
        }

        deleteMessage(index) {
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (!chat) return;
            const message = chat.messages[index];
            if (!message) return;
            if (message.streaming) return;
            if (confirm('Delete this message?')) {
                chat.messages.splice(index, 1);
                this.saveToStorage();
                this.renderMessages();
            }
        }

        async resendMessage(index) {
            if (this.isResponding) return;
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (!chat) return;
            const message = chat.messages[index];
            if (!message || message.role !== 'user') return;
            const userMessage = message.content;
            const apiKey = this.getApiKey();
            if (apiKey && this.selectedModel) {
                this.isResponding = true;
                this.updateSendButton();
                await this.sendToOpenRouter(chat, apiKey, this.selectedModel, userMessage);
            }
        }

        renderChatList() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';
            
            this.chats.forEach(chat => {
                const chatItem = document.createElement('div');
                chatItem.className = 'chat-list-item';
                if (chat.id === this.currentChatId) chatItem.classList.add('active');
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'chat-list-item-name';
                nameSpan.textContent = chat.name;
                
                const menuBtn = document.createElement('button');
                menuBtn.className = 'chat-menu-btn';
                menuBtn.textContent = '⋮';
                menuBtn.title = 'Chat options';
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this._openChatMenu(chat.id);
                });
                
                chatItem.appendChild(nameSpan);
                chatItem.appendChild(menuBtn);
                chatItem.addEventListener('click', () => this.switchToChat(chat.id));
                chatList.appendChild(chatItem);
            });
        }

        _openChatMenu(chatId) {
            const chat = this.chats.find(c => c.id === chatId);
            if (!chat) return;
            
            const items = [
                { label: '✎ Rename', action: () => this._chatAction(chatId, () => this.renameChat(chatId)) },
                { label: '💬 Summarize Range', action: () => this._chatAction(chatId, () => this.openSummarizeModal(chatId)) },
                { label: '📋 Duplicate', action: () => this._chatAction(chatId, () => this.duplicateCurrentChat()) },
                { label: '💾 Export', action: () => this._chatAction(chatId, () => this.exportCurrentChat()) },
                { label: '☁️💾 Export to Cloud', action: () => this._chatAction(chatId, () => this.exportChatToCloud(chatId)) },
                { label: '🗑️ Delete', danger: true, action: () => this._chatAction(chatId, () => this.deleteCurrentChat()) }
            ];
            
            this.showBottomSheet(items);
        }

        _chatAction(chatId, action) {
            if (chatId !== this.currentChatId) {
                this.switchToChat(chatId);
                setTimeout(action, 80);
            } else {
                action();
            }
        }

        renameChat(chatId) {
            const chat = this.chats.find(c => c.id === chatId);
            if (!chat) return;
            const newName = prompt('Rename chat:', chat.name);
            if (newName !== null && newName.trim() !== '') {
                chat.name = newName.trim();
                this.saveToStorage();
                this.renderChatList();
                this.updateChatTitle();
            }
        }

        updateChatTitle() {
            const chatTitle = document.getElementById('chatTitle');
            if (this.currentView === 'lore') { chatTitle.textContent = 'Lore Management'; return; }
            if (this.currentView === 'settings') { chatTitle.textContent = 'Settings'; return; }
            if (!this.currentChatId) { chatTitle.textContent = 'New Chat'; return; }
            const chat = this.chats.find(c => c.id === this.currentChatId);
            chatTitle.textContent = chat ? chat.name : 'New Chat';
        }

        openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        openSummarizeModal(chatId) {
            const chat = this.chats.find(c => c.id === chatId);
            if (!chat) return;
            if (chat.messages.length === 0) {
                alert('This chat has no messages to summarize.');
                return;
            }
            
            this._summarizeState = {
                chatId: chat.id,
                startIndex: -1,
                endIndex: -1,
                phase: 'pick',
                preset: 'standard',
                isGenerating: false,
                abortController: null,
                title: '',
                keys: '',
                summary: '',
                streamBuffer: '',
                previousAttempt: null,
                pickerRefs: null
            };
            
            this._renderSummarizeModal();
            const overlay = document.getElementById('summarizeModal');
            if (overlay) overlay.classList.add('active');
        }

        closeSummarizeModal() {
            if (this._summarizeState && this._summarizeState.abortController) {
                try { this._summarizeState.abortController.abort(); } catch (e) {}
            }
            this._summarizeState = null;
            const overlay = document.getElementById('summarizeModal');
            if (overlay) overlay.classList.remove('active');
        }

        _renderSummarizeModal() {
            const state = this._summarizeState;
            if (!state) return;
            const chat = this.chats.find(c => c.id === state.chatId);
            if (!chat) return;
            
            state.pickerRefs = null;
            
            let overlay = document.getElementById('summarizeModal');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'summarizeModal';
                overlay.className = 'modal-overlay';
                document.body.appendChild(overlay);
            }
            
            overlay.innerHTML = '';
            const content = document.createElement('div');
            content.className = 'modal-content';
            
            const header = document.createElement('div');
            header.className = 'modal-header';
            const title = document.createElement('h2');
            title.textContent = 'Summarize Range';
            const closeBtn = document.createElement('button');
            closeBtn.className = 'modal-close';
            closeBtn.textContent = '✕';
            closeBtn.addEventListener('click', () => this.closeSummarizeModal());
            header.appendChild(title);
            header.appendChild(closeBtn);
            content.appendChild(header);
            
            const body = document.createElement('div');
            body.className = 'modal-body';
            content.appendChild(body);
            
            overlay.appendChild(content);
            
            if (state.phase === 'pick') this._buildSummarizePicker(body, chat);
            else if (state.phase === 'ready' || state.phase === 'generating') this._renderSummarizeGenerate(body, chat);
            else if (state.phase === 'result') this._renderSummarizeResult(body, chat);
        }

        _buildSummarizePicker(body, chat) {
            const state = this._summarizeState;
            body.classList.add('picker-mode');
            
            const help = document.createElement('div');
            help.className = 'modal-help';
            body.appendChild(help);
            
            const list = document.createElement('div');
            list.className = 'message-list';
            const items = [];
            
            chat.messages.forEach((msg, i) => {
                const item = document.createElement('div');
                item.className = 'message-list-item';
                
                const role = document.createElement('div');
                role.className = 'message-list-role';
                item.appendChild(role);
                
                const preview = document.createElement('div');
                preview.className = 'message-list-preview';
                const content = (msg.content || '').replace(/\s+/g, ' ').trim();
                preview.textContent = content.length > 160 ? content.substring(0, 160) + '…' : content;
                item.appendChild(preview);
                
                item.addEventListener('click', () => this._summarizePickMessage(i));
                list.appendChild(item);
                items.push({
                    el: item,
                    roleEl: role,
                    baseRoleText: msg.role === 'user' ? 'You' : 'Assistant'
                });
            });
            body.appendChild(list);
            
            const footer = document.createElement('div');
            footer.className = 'modal-footer';
            footer.style.marginTop = '0';
            
            const info = document.createElement('div');
            info.className = 'modal-info';
            info.style.flex = '1';
            info.style.alignSelf = 'center';
            footer.appendChild(info);
            
            const resetBtn = document.createElement('button');
            resetBtn.className = 'modal-secondary-btn';
            resetBtn.textContent = 'Reset';
            resetBtn.addEventListener('click', () => {
                const s = this._summarizeState;
                if (!s) return;
                s.startIndex = -1;
                s.endIndex = -1;
                this._updateSummarizePicker();
            });
            footer.appendChild(resetBtn);
            
            const continueBtn = document.createElement('button');
            continueBtn.className = 'modal-primary-btn';
            continueBtn.textContent = 'Continue';
            continueBtn.addEventListener('click', () => {
                const s = this._summarizeState;
                if (!s) return;
                s.phase = 'ready';
                this._renderSummarizeModal();
            });
            footer.appendChild(continueBtn);
            
            body.appendChild(footer);
            
            state.pickerRefs = { helpEl: help, items, infoEl: info, resetBtn, continueBtn };
            
            this._updateSummarizePicker();
        }

        _updateSummarizePicker() {
            const state = this._summarizeState;
            if (!state || !state.pickerRefs) return;
            const refs = state.pickerRefs;
            
            if (state.startIndex < 0) {
                refs.helpEl.textContent = 'Tap a message to mark the start of the range.';
            } else if (state.endIndex < 0) {
                refs.helpEl.textContent = 'Now tap another message to mark the end. Tap the start message again to clear.';
            } else {
                refs.helpEl.textContent = 'Range selected. Tap the end message to adjust it, or the start to reset.';
            }
            
            refs.items.forEach((item, i) => {
                const isStart = state.startIndex === i;
                const isEnd = state.endIndex === i;
                const inRange = state.startIndex >= 0 && state.endIndex >= 0 && i > state.startIndex && i < state.endIndex;
                
                item.el.classList.toggle('selected', isStart || isEnd);
                item.el.classList.toggle('in-range', inRange);
                
                let text = item.baseRoleText;
                if (isStart) text += '  ·  START';
                if (isEnd) text += '  ·  END';
                if (item.roleEl.textContent !== text) item.roleEl.textContent = text;
            });
            
            const hasSelection = state.startIndex >= 0;
            const hasRange = state.startIndex >= 0 && state.endIndex >= 0;
            
            refs.resetBtn.style.display = hasSelection ? '' : 'none';
            refs.continueBtn.style.display = hasRange ? '' : 'none';
            
            if (hasRange) {
                const count = state.endIndex - state.startIndex + 1;
                refs.infoEl.textContent = `Messages ${state.startIndex + 1}–${state.endIndex + 1} (${count})`;
            } else if (hasSelection) {
                refs.infoEl.textContent = `Start at message ${state.startIndex + 1}`;
            } else {
                refs.infoEl.textContent = '';
            }
        }

        _summarizePickMessage(i) {
            const state = this._summarizeState;
            if (!state) return;
            
            if (state.startIndex < 0) {
                state.startIndex = i;
                state.endIndex = -1;
            } else if (state.endIndex < 0) {
                if (i === state.startIndex) {
                    state.startIndex = -1;
                } else if (i < state.startIndex) {
                    state.endIndex = state.startIndex;
                    state.startIndex = i;
                } else {
                    state.endIndex = i;
                }
            } else {
                if (i === state.endIndex) {
                    state.endIndex = -1;
                } else if (i === state.startIndex) {
                    state.startIndex = -1;
                    state.endIndex = -1;
                } else {
                    state.startIndex = i;
                    state.endIndex = -1;
                }
            }
            
            this._updateSummarizePicker();
            
            if (state.pickerRefs && state.pickerRefs.items[i]) {
                state.pickerRefs.items[i].el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        _renderSummarizeGenerate(body, chat) {
            const state = this._summarizeState;
            
            const info = document.createElement('div');
            info.className = 'modal-info';
            const count = state.endIndex - state.startIndex + 1;
            info.textContent = `Messages ${state.startIndex + 1}–${state.endIndex + 1} (${count} messages)`;
            body.appendChild(info);
            
            const est = this._estimateTokens(chat, state.startIndex, state.endIndex);
            const estDiv = document.createElement('div');
            estDiv.className = 'modal-info';
            const targetTokens = state.preset === 'brief' ? 350 : state.preset === 'detailed' ? 1200 : 700;
            estDiv.textContent = `~${est.input.toLocaleString()} input tokens, up to ~${targetTokens} output tokens`;
            body.appendChild(estDiv);
            
            const presetLabel = document.createElement('div');
            presetLabel.className = 'modal-label';
            presetLabel.textContent = 'Detail level';
            body.appendChild(presetLabel);
            
            const presetRow = document.createElement('div');
            presetRow.className = 'preset-row';
            const presets = [
                { id: 'brief', label: 'Brief', tokens: '~350' },
                { id: 'standard', label: 'Standard', tokens: '~700' },
                { id: 'detailed', label: 'Detailed', tokens: '~1200' }
            ];
            presets.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn';
                if (state.preset === p.id) btn.classList.add('active');
                btn.innerHTML = `<div class="preset-label">${p.label}</div><div class="preset-tokens">${p.tokens}</div>`;
                btn.disabled = state.isGenerating;
                btn.addEventListener('click', () => {
                    if (state.isGenerating) return;
                    state.preset = p.id;
                    this._renderSummarizeModal();
                });
                presetRow.appendChild(btn);
            });
            body.appendChild(presetRow);
            
            if (state.isGenerating) {
                const previewLabel = document.createElement('div');
                previewLabel.className = 'modal-label';
                previewLabel.textContent = 'Generating…';
                body.appendChild(previewLabel);
                
                const previewBox = document.createElement('div');
                previewBox.className = 'stream-preview';
                previewBox.id = 'streamPreview';
                previewBox.textContent = state.streamBuffer || '';
                body.appendChild(previewBox);
            }
            
            if (state.previousAttempt) {
                const prevLabel = document.createElement('div');
                prevLabel.className = 'modal-label';
                prevLabel.textContent = 'Previous attempt';
                body.appendChild(prevLabel);
                
                const prevBox = document.createElement('div');
                prevBox.className = 'previous-attempt';
                prevBox.textContent = state.previousAttempt;
                body.appendChild(prevBox);
            }
            
            const footer = document.createElement('div');
            footer.className = 'modal-footer';
            
            const backBtn = document.createElement('button');
            backBtn.className = 'modal-secondary-btn';
            backBtn.textContent = 'Back';
            backBtn.disabled = state.isGenerating;
            backBtn.addEventListener('click', () => {
                state.phase = 'pick';
                this._renderSummarizeModal();
            });
            footer.appendChild(backBtn);
            
            if (state.isGenerating) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'modal-secondary-btn danger';
                cancelBtn.textContent = 'Cancel';
                cancelBtn.addEventListener('click', () => this._abortSummarize());
                footer.appendChild(cancelBtn);
            } else {
                const genBtn = document.createElement('button');
                genBtn.className = 'modal-primary-btn';
                genBtn.textContent = state.previousAttempt ? 'Retry' : 'Generate';
                genBtn.addEventListener('click', () => this._runSummarize());
                footer.appendChild(genBtn);
            }
            body.appendChild(footer);
        }

        _renderSummarizeResult(body, chat) {
            const state = this._summarizeState;
            
            const titleLabel = document.createElement('div');
            titleLabel.className = 'modal-label';
            titleLabel.textContent = 'Title';
            body.appendChild(titleLabel);
            const titleInput = document.createElement('input');
            titleInput.type = 'text';
            titleInput.className = 'modal-input';
            titleInput.value = state.title;
            titleInput.addEventListener('input', () => state.title = titleInput.value);
            body.appendChild(titleInput);
            
            const keysLabel = document.createElement('div');
            keysLabel.className = 'modal-label';
            keysLabel.textContent = 'Keyword suggestions (comma-separated)';
            body.appendChild(keysLabel);
            const keysInput = document.createElement('input');
            keysInput.type = 'text';
            keysInput.className = 'modal-input';
            keysInput.value = state.keys;
            keysInput.addEventListener('input', () => state.keys = keysInput.value);
            body.appendChild(keysInput);
            
            const summaryLabel = document.createElement('div');
            summaryLabel.className = 'modal-label';
            summaryLabel.textContent = 'Summary';
            body.appendChild(summaryLabel);
            const summaryTextarea = document.createElement('textarea');
            summaryTextarea.className = 'modal-textarea';
            summaryTextarea.value = state.summary;
            summaryTextarea.addEventListener('input', () => state.summary = summaryTextarea.value);
            body.appendChild(summaryTextarea);
            
            const tokens = Math.round((state.title.length + state.keys.length + state.summary.length) / 4);
            const tokenInfo = document.createElement('div');
            tokenInfo.className = 'modal-info';
            tokenInfo.textContent = `Generated ~${tokens} tokens`;
            body.appendChild(tokenInfo);
            
            const footer = document.createElement('div');
            footer.className = 'modal-footer';
            
            const closeBtn = document.createElement('button');
            closeBtn.className = 'modal-secondary-btn';
            closeBtn.textContent = 'Close';
            closeBtn.addEventListener('click', () => this.closeSummarizeModal());
            footer.appendChild(closeBtn);
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'modal-secondary-btn';
            copyBtn.textContent = 'Copy';
            copyBtn.addEventListener('click', () => this._copySummary(copyBtn));
            footer.appendChild(copyBtn);
            
            const retryBtn = document.createElement('button');
            retryBtn.className = 'modal-secondary-btn';
            retryBtn.textContent = 'Retry';
            retryBtn.addEventListener('click', () => this._runSummarize());
            footer.appendChild(retryBtn);
            
            const saveBtn = document.createElement('button');
            saveBtn.className = 'modal-primary-btn';
            saveBtn.textContent = 'Save to Lorebook';
            saveBtn.addEventListener('click', () => this._openSavePicker());
            footer.appendChild(saveBtn);
            
            body.appendChild(footer);
        }

        _estimateTokens(chat, startIndex, endIndex) {
            const messages = chat.messages.slice(startIndex, endIndex + 1);
            let chars = 0;
            messages.forEach(m => { chars += (m.content || '').length + 20; });
            return { input: Math.round(chars / 4) };
        }

        _abortSummarize() {
            const state = this._summarizeState;
            if (!state) return;
            if (state.abortController) {
                try { state.abortController.abort(); } catch (e) {}
            }
            state.isGenerating = false;
            state.abortController = null;
            state.phase = 'ready';
            this._renderSummarizeModal();
        }

        _updateSummarizeStream(text) {
            const el = document.getElementById('streamPreview');
            if (el) {
                el.textContent = text;
                el.scrollTop = el.scrollHeight;
            }
        }

        _parseSummaryOutput(raw) {
            const result = { title: '', keys: '', summary: '' };
            if (!raw) return result;
            
            const titleMatch = raw.match(/^\s*Title:\s*(.+)$/im);
            const keysMatch = raw.match(/^\s*Keywords?:\s*(.+)$/im);
            const sumMatch = raw.match(/^\s*Summary:\s*([\s\S]*)$/im);
            
            if (titleMatch) result.title = titleMatch[1].trim();
            if (keysMatch) result.keys = keysMatch[1].trim();
            if (sumMatch) result.summary = sumMatch[1].trim();
            
            if (!result.summary) {
                let remainder = raw;
                if (titleMatch) remainder = remainder.replace(titleMatch[0], '');
                if (keysMatch) remainder = remainder.replace(keysMatch[0], '');
                result.summary = remainder.trim();
            }
            return result;
        }

        async _runSummarize() {
            const state = this._summarizeState;
            if (!state) return;
            const chat = this.chats.find(c => c.id === state.chatId);
            if (!chat) return;
            
            const apiKey = this.getApiKey();
            if (!apiKey || !this.selectedModel) {
                alert('Please configure your API key and model first.');
                return;
            }
            
            if (state.summary) {
                state.previousAttempt = `Title: ${state.title}\nKeywords: ${state.keys}\n\n${state.summary}`;
            }
            
            state.isGenerating = true;
            state.streamBuffer = '';
            state.title = '';
            state.keys = '';
            state.summary = '';
            state.phase = 'generating';
            this._renderSummarizeModal();
            
            const targetTokens = state.preset === 'brief' ? 350 : state.preset === 'detailed' ? 1200 : 700;
            const selectedMessages = chat.messages.slice(state.startIndex, state.endIndex + 1);
            const transcript = selectedMessages.map(m =>
                `${m.role === 'user' ? 'User' : 'Assistant'}: ${m.content}`
            ).join('\n\n');
            
            const prompt = `You are summarizing a scene from a roleplay chat. Your output becomes a "chapter" entry in a lorebook, so it must stand alone and be useful for recall.

Output ONLY in this exact format, with nothing before or after:

Title: <a short, evocative title, in the style of a chapter heading, e.g. "Café Encounter" or "The Promotion Agreement">
Keywords: <3–8 comma-separated keywords drawn from distinctive proper nouns, places, objects, or events. Prefer specific names over generic concepts. Do NOT use generic words like "sex", "man", or "love".>
Summary: <a concise, factual summary of what happened. Aim for around ${Math.round(targetTokens * 0.8)} tokens. Preserve specific names, decisions, consequences, and any changes in relationships or situation. Do not editorialize. Do not add commentary.>

Transcript to summarize:
---
${transcript}
---`;

            state.abortController = new AbortController();
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Roleplay Chat'
                    },
                    body: JSON.stringify({
                        model: this.selectedModel,
                        messages: [
                            { role: 'system', content: 'You are a precise summarizer. Follow the requested output format exactly.' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.5,
                        top_p: 0.9,
                        max_tokens: targetTokens + 200,
                        stream: true
                    }),
                    signal: state.abortController.signal
                });
                
                if (!response.ok) {
                    let errorMessage = `HTTP ${response.status}`;
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.error?.message || errorMessage;
                    } catch {
                        const text = await response.text();
                        if (text) errorMessage = text.substring(0, 500);
                    }
                    throw new Error(errorMessage);
                }
                
                if (!response.body) throw new Error('Response has no body');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let rawOutput = '';
                let streamDone = false;
                
                while (!streamDone) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    buffer = buffer.replace(/\r\n/g, '\n');
                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        const eventText = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        const data = this._extractSSEData(eventText);
                        if (data === null) continue;
                        if (data === '[DONE]') { streamDone = true; break; }
                        let parsed;
                        try { parsed = JSON.parse(data); } catch { continue; }
                        if (parsed.error) throw new Error(parsed.error.message || 'Stream error');
                        const choice = parsed.choices && parsed.choices[0];
                        if (!choice) continue;
                        const delta = choice.delta && choice.delta.content;
                        if (delta) {
                            rawOutput += delta;
                            state.streamBuffer = rawOutput;
                            this._updateSummarizeStream(rawOutput);
                        }
                    }
                }
                
                const parsed = this._parseSummaryOutput(rawOutput);
                state.title = parsed.title;
                state.keys = parsed.keys;
                state.summary = parsed.summary;
                state.isGenerating = false;
                state.abortController = null;
                state.phase = 'result';
                this._renderSummarizeModal();
            } catch (error) {
                if (error.name === 'AbortError') {
                    state.isGenerating = false;
                    state.abortController = null;
                    state.phase = 'ready';
                    this._renderSummarizeModal();
                    return;
                }
                state.isGenerating = false;
                state.abortController = null;
                alert(`Summarize failed: ${error.message}`);
                state.phase = 'ready';
                this._renderSummarizeModal();
            }
        }

        _copySummary(btn) {
            const state = this._summarizeState;
            if (!state) return;
            const text = `Title: ${state.title}\nKeywords: ${state.keys}\n\n${state.summary}`;
            const finish = (success) => {
                const orig = btn.textContent;
                btn.textContent = success ? 'Copied!' : 'Copy failed';
                setTimeout(() => btn.textContent = orig, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => finish(true)).catch(() => finish(false));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    finish(true);
                } catch (e) { finish(false); }
                document.body.removeChild(ta);
            }
        }

        _defaultSaveTarget() {
            const chat = this.chats.find(c => c.id === this.currentChatId);
            if (chat && chat.activeLorebooks && chat.activeLorebooks.length > 0) {
                const active = this.lorebooks.find(lb => lb.id === chat.activeLorebooks[0]);
                if (active) return active.id;
            }
            if (this.lorebooks.length > 0) return this.lorebooks[0].id;
            return null;
        }

        _openSavePicker() {
            const state = this._summarizeState;
            if (!state) return;
            
            let picker = document.getElementById('savePicker');
            if (!picker) {
                picker = document.createElement('div');
                picker.id = 'savePicker';
                picker.className = 'save-picker-overlay';
                picker.addEventListener('click', (e) => {
                    if (e.target === picker) this._closeSavePicker();
                });
                document.body.appendChild(picker);
            }
            picker.innerHTML = '';
            
            const panel = document.createElement('div');
            panel.className = 'save-picker-panel';
            
            const label = document.createElement('div');
            label.className = 'modal-label';
            label.textContent = 'Save to lorebook';
            panel.appendChild(label);
            
            let selectedLorebookId = this._defaultSaveTarget();
            
            const select = document.createElement('select');
            select.className = 'modal-select';
            if (this.lorebooks.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'No lorebooks — create one with + New';
                select.appendChild(opt);
                select.disabled = true;
            } else {
                this.lorebooks.forEach(lb => {
                    const opt = document.createElement('option');
                    opt.value = lb.id;
                    opt.textContent = lb.name;
                    if (lb.id === selectedLorebookId) opt.selected = true;
                    select.appendChild(opt);
                });
            }
            select.addEventListener('change', () => selectedLorebookId = select.value);
            panel.appendChild(select);
            
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.className = 'modal-input';
            newInput.placeholder = 'New lorebook name';
            newInput.style.display = 'none';
            newInput.style.marginTop = '8px';
            panel.appendChild(newInput);
            
            const btnRow = document.createElement('div');
            btnRow.className = 'modal-footer';
            
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'modal-secondary-btn';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', () => this._closeSavePicker());
            btnRow.appendChild(cancelBtn);
            
            const newBtn = document.createElement('button');
            newBtn.className = 'modal-secondary-btn';
            newBtn.textContent = '+ New';
            newBtn.addEventListener('click', () => {
                newInput.style.display = 'block';
                newInput.focus();
                select.disabled = true;
                newBtn.style.display = 'none';
            });
            btnRow.appendChild(newBtn);
            
            const saveBtn = document.createElement('button');
            saveBtn.className = 'modal-primary-btn';
            saveBtn.textContent = 'Confirm';
            saveBtn.addEventListener('click', async () => {
                let targetLb;
                const isCreatingNew = newInput.style.display !== 'none' && newInput.value.trim();
                if (isCreatingNew) {
                    targetLb = {
                        id: this.generateId(),
                        name: newInput.value.trim(),
                        entries: [],
                        imported: Date.now()
                    };
                    await LorebookStorage.saveLorebook(targetLb);
                    this.lorebooks.push(targetLb);
                } else if (selectedLorebookId) {
                    targetLb = this.lorebooks.find(lb => lb.id === selectedLorebookId);
                }
                
                if (!targetLb) {
                    alert('Please select or create a lorebook.');
                    return;
                }
                
                const newEntry = {
                    uid: Date.now(),
                    keys: (state.keys || '').split(',').map(k => k.trim()).filter(k => k),
                    keysecondary: [],
                    comment: state.title || 'Untitled Chapter',
                    content: state.summary,
                    order: 100,
                    disabled: false,
                    constant: false,
                    collapsed: false
                };
                targetLb.entries.push(newEntry);
                await LorebookStorage.saveLorebook(targetLb);
                
                this._closeSavePicker();
                this.closeSummarizeModal();
                alert(`Saved to "${targetLb.name}".`);
            });
            btnRow.appendChild(saveBtn);
            
            panel.appendChild(btnRow);
            picker.appendChild(panel);
            picker.classList.add('active');
        }

        _closeSavePicker() {
            const picker = document.getElementById('savePicker');
            if (picker) picker.classList.remove('active');
        }

        autoResizeInput() {
            const input = document.getElementById('messageInput');
            const computed = window.getComputedStyle(input);
            let lineHeight = parseFloat(computed.lineHeight);
            if (isNaN(lineHeight) || lineHeight <= 0) lineHeight = parseFloat(computed.fontSize) * 1.4;
            const settingMax = this.uiSettings.maxInputLines * lineHeight;
            const viewportMax = window.innerHeight * 0.4;
            const maxHeight = Math.min(settingMax, viewportMax);
            input.style.maxHeight = maxHeight + 'px';
            const prevScrollTop = input.scrollTop;
            input.style.height = 'auto';
            const newHeight = Math.min(input.scrollHeight, maxHeight);
            input.style.height = newHeight + 'px';
            if (input.scrollHeight <= input.clientHeight + 1) {
                input.scrollTop = 0;
                return;
            }
            input.scrollTop = prevScrollTop;
            this.keepCaretVisible(input);
        }

        keepCaretVisible(textarea) {
            const caretStart = textarea.selectionStart;
            const caretEnd = textarea.selectionEnd;
            const caretAtEnd = caretStart === textarea.value.length && caretEnd === textarea.value.length;
            if (caretAtEnd) {
                textarea.scrollTop = textarea.scrollHeight;
                return;
            }
            const computed = window.getComputedStyle(textarea);
            const mirror = document.createElement('div');
            const props = [
                'fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing',
                'lineHeight', 'textTransform', 'textIndent', 'wordSpacing',
                'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
                'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
                'boxSizing', 'width'
            ];
            props.forEach(p => { mirror.style[p] = computed[p]; });
            mirror.style.position = 'absolute';
            mirror.style.top = '0';
            mirror.style.left = '-9999px';
            mirror.style.visibility = 'hidden';
            mirror.style.height = 'auto';
            mirror.style.overflow = 'hidden';
            mirror.style.whiteSpace = 'pre-wrap';
            mirror.style.wordWrap = 'break-word';
            mirror.style.overflowWrap = 'break-word';
            mirror.textContent = textarea.value.substring(0, caretStart);
            const marker = document.createElement('span');
            marker.textContent = '\u200b';
            mirror.appendChild(marker);
            document.body.appendChild(mirror);
            const caretTop = marker.offsetTop;
            const lineHeight = parseFloat(computed.lineHeight) || parseFloat(computed.fontSize) * 1.4;
            const caretBottom = caretTop + lineHeight;
            document.body.removeChild(mirror);
            const viewTop = textarea.scrollTop;
            const viewBottom = viewTop + textarea.clientHeight;
            if (caretBottom > viewBottom) textarea.scrollTop = caretBottom - textarea.clientHeight;
            else if (caretTop < viewTop) textarea.scrollTop = Math.max(0, caretTop);
        }

        bindEvents() {
            document.getElementById('hamburgerBtn').addEventListener('click', () => this.openSidebar());
            document.getElementById('closeSidebarBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                this.closeSidebar();
            });
            document.getElementById('sidebarOverlay').addEventListener('click', () => this.closeSidebar());
            document.getElementById('newChatBtn').addEventListener('click', () => this.createNewChat());
            
            document.getElementById('viewToggleBtn').addEventListener('click', () => this.toggleView());
            document.getElementById('settingsToggleBtn').addEventListener('click', () => this.toggleSettingsView());
            document.getElementById('importChatBtn').addEventListener('click', () => this.showImportOptions());
            document.getElementById('sendButton').addEventListener('click', () => this.handleSendButton());
            
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const start = messageInput.selectionStart;
                    const end = messageInput.selectionEnd;
                    messageInput.value = messageInput.value.substring(0, start) + '\n' + messageInput.value.substring(end);
                    messageInput.selectionStart = messageInput.selectionEnd = start + 1;
                    this.autoResizeInput();
                }
            });
            messageInput.addEventListener('input', () => this.autoResizeInput());
            
            const messagesContainer = document.getElementById('messages');
            messagesContainer.addEventListener('scroll', () => {
                this._scheduleScrollSave();
            }, { passive: true });
            
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (this._scrollSaveTimer) {
                        clearTimeout(this._scrollSaveTimer);
                        this._scrollSaveTimer = null;
                    }
                    this._saveScrollPosition();
                }
            });
            
            document.getElementById('apiKeyInput').addEventListener('input', () => {
                this.saveSettings();
                const apiKey = this.getApiKey();
                if (apiKey) this.fetchModels(apiKey);
            });
            
            document.getElementById('modelSelectWrapper').addEventListener('click', () => {
                const dropdown = document.getElementById('modelDropdown');
                const wasActive = dropdown.classList.contains('active');
                dropdown.classList.toggle('active');
                if (!wasActive) {
                    document.getElementById('modelSearch').value = '';
                    this.renderModelOptions();
                    requestAnimationFrame(() => this._positionModelDropdown());
                }
            });
            
            document.getElementById('modelSearch').addEventListener('input', (e) => {
                this.renderModelOptions(e.target.value);
            });
            
            document.getElementById('modelDropdown').addEventListener('click', (e) => {
                e.stopPropagation();
            });
            
            document.getElementById('modelDropdownClose').addEventListener('click', () => {
                document.getElementById('modelDropdown').classList.remove('active');
            });
            
            document.getElementById('testConnectionBtn').addEventListener('click', () => this.testConnection());
            
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json';
            fileInput.style.display = 'none';
            fileInput.id = 'lorebookFileInput';
            document.body.appendChild(fileInput);
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) this.importLorebook(e.target.files[0]);
                e.target.value = '';
            });
            
            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('modelDropdown');
                const wrapper = document.getElementById('modelSelectWrapper');
                if (dropdown.classList.contains('active') &&
                    !dropdown.contains(e.target) &&
                    !wrapper.contains(e.target)) {
                    dropdown.classList.remove('active');
                }
            });
            
            window.addEventListener('resize', () => {
                const vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
                this.autoResizeInput();
                clearTimeout(this._dropdownRepositionTimer);
                this._dropdownRepositionTimer = setTimeout(() => {
                    this._positionModelDropdown();
                }, 150);
            });
            
            window.addEventListener('orientationchange', () => {
                clearTimeout(this._dropdownRepositionTimer);
                this._dropdownRepositionTimer = setTimeout(() => {
                    this._positionModelDropdown();
                }, 250);
            });
            
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    clearTimeout(this._dropdownRepositionTimer);
                    this._dropdownRepositionTimer = setTimeout(() => {
                        this._positionModelDropdown();
                    }, 150);
                });
            }
            
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        handleSendButton() {
            if (this.isResponding) this.stopResponse();
            else this.sendMessage();
        }

        stopResponse() {
            if (this.abortController) {
                this.abortController.abort();
                this.isResponding = false;
                this.updateSendButton();
            }
        }

        updateSendButton() {
            const sendButton = document.getElementById('sendButton');
            if (this.isResponding) {
                sendButton.textContent = '■';
                sendButton.style.background = 'var(--danger)';
                sendButton.disabled = false;
            } else {
                sendButton.textContent = '➤';
                sendButton.style.background = 'var(--accent)';
                sendButton.disabled = false;
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.app = new ChatApp();
    });
    </script>
